# Keep the SHA-pinned actions current. Every `uses:` in .github/workflows/ is
# pinned to a commit SHA; without an updater those pins rot silently, which is
# exactly the failure mode pinning is supposed to prevent.
#
# The uv lockfile is deliberately not listed here: the scientific stack is
# pinned on purpose (ultralytics 8.3.x needs numpy<2), so automatic bumps would
# open PRs that cannot pass. Update it by hand with `uv lock` and the matrix
# run. Enable the `uv` ecosystem once the pins are loosened. Dependabot alerts
# and security updates are already on in the repository settings, recorded in
# docs/agents/repository-settings.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Patch and minor bumps arrive as one PR: the workflows are tested
      # together, and splitting a runner bump from its companions adds noise.
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Majors stay ungrouped so each arrives with its own migration notes.
