# Trigger: mention /opencode or /oc in an issue or PR comment and OpenCode
# runs in the GitHub Actions runner, implements the request, pushes a branch,
# opens a PR and replies to the comment.
#
# The model comes from the OpenCode Go subscription: the repo secret
# OPENCODE_GO_API_KEY holds the `oc_sk_...` key from the Console, and the
# provider below points at the Go inference endpoint. `beam-free` is $0
# against the plan (limited time and regions); swap it for a paid-in-plan
# model such as `oc-go/mimo-v2.6-flash` for stronger edits.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per comment; overlapping comments should queue rather than race
# on the same working tree.
concurrency:
  group: opencode-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenCode
        run: npm install -g @opencode/cli

      # Go is not a built-in OpenCode provider config in CI, so declare it as
      # an OpenAI-compatible custom provider over the Go endpoint. The key is
      # resolved from the environment at request time, never written to disk.
      - name: Write OpenCode config for Go
        run: |
          cat > opencode.jsonc <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "providers": {
              "oc-go": {
                "name": "OpenCode Go",
                "env": ["OPENCODE_GO_API_KEY"],
                "package": "@opencode/ai/providers/openai-compatible",
                "settings": {
                  "baseURL": "https://opencode.ai/inference/go/openai/v1",
                  "apiKey": "{env:OPENCODE_GO_API_KEY}"
                },
                "models": {
                  "beam-free": { "name": "Beam Free" },
                  "iceman-contributor-free": { "name": "Iceman Contributor Free" },
                  "mimo-v2.6-flash": { "name": "MiMo V2.6 Flash" },
                  "glm-5.3-flash": { "name": "GLM 5.3 Flash" },
                  "qwen3.8-flash": { "name": "Qwen 3.8 Flash" },
                  "deepseek-v4.1-flash": { "name": "DeepSeek V4.1 Flash" }
                }
              }
            },
            "model": "oc-go/beam-free"
          }
          EOF

      - name: Run OpenCode
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opencode run --standalone --auto \
            --model oc-go/beam-free \
            "You are running in GitHub Actions for ${{ github.repository }}.
            Triggering comment: ${{ github.event.comment.body }}
            Target issue/PR number: ${{ github.event.issue.number || github.event.pull_request.number }}.
            Use git and the gh CLI (GITHUB_TOKEN is set) to implement the request:
            create a branch, commit, open a PR, and reply to the triggering issue/PR comment when finished.
            Keep changes minimal and run any available tests first."
