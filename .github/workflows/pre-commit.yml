# Run the same hooks contributors install locally, so a hook that was never
# installed still fails the PR. `--only-dev` installs the dev group without the
# project or its runtime dependencies: the hooks need pre-commit and the
# standard library, not torch or PySide6.
name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install pre-commit
        run: uv sync --locked --only-dev

      # The gate in ci.yml owns ruff: `python tools/check.py` runs both ruff
      # commands from the development group, pinned to the same version the
      # hooks install. Skip the two ruff hooks here so the preview does not
      # enforce that check a second time (and auto-fix files in CI); they stay
      # in .pre-commit-config.yaml for local use.
      - name: Run hooks
        env:
          SKIP: ruff-check,ruff-format
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
