# Publishing to PyPI through Trusted Publishing (OIDC): there is no token to
# leak or rotate. Triggered by a `v*` tag (e.g. `git tag v2.0.0 && git push
# --tags`) or manually from the Actions UI. A manual run is a rehearsal: it
# runs the whole CI workflow — gate, suite, wheel build and, since the event is
# not a pull request, the installed-wheel smoke — then reuses the distributions
# that run produced and uploads nothing to PyPI.
#
# Before the first run, create the project on PyPI and register this
# repository as a publisher (Settings -> Publishing -> Add a new publisher)
# with environment "pypi". Without that the upload fails with 403.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A publish is never cancelled halfway: a partially uploaded release is worse
# than a queued one. Let runs queue instead of killing each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The desktop ZIP is built and checksummed before PyPI is touched. Desktop
  # delivery must not depend on PyPI credentials or availability (#203), so a
  # failed upload cannot cost the user the Pillow fix while a valid desktop
  # artifact already exists.
  desktop:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # The archive is built from the tagged tree, and the checksum names the
      # exact bytes the release attaches. It is not GitHub's generated
      # source snapshot, which the release job does not produce.
      - name: Build the desktop ZIP and its SHA-256
        run: >-
          python tools/packaging/desktop_release.py
          --out dist/desktop
          --source .
          --name "polyx-desktop-${GITHUB_REF_NAME}"

      # Prove the artifact opens and carries the surfaces a desktop install
      # starts, before it is offered to a user.
      - name: The desktop ZIP opens and carries the program
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = next(Path("dist/desktop").glob("polyx-desktop-*.zip"))
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.testzip() is None
              names = set(zipped.namelist())
          for required in (
              "install/bootstrap.py",
              "install/update.py",
              "src/polyx/launcher.py",
              "src/polyx/locales/es/LC_MESSAGES/messages.po",
              "requirements.txt",
          ):
              assert required in names, f"{required} missing from {archive.name}"
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: |
            dist/desktop/*.zip
            dist/desktop/*.sha256
          retention-days: 7
          if-no-files-found: error

  # The same workflow every PR runs, so a tag on a red commit cannot reach
  # PyPI, where a version number is spent forever. Named `ci`, not `gate`:
  # "gate" is the local check runner inside that workflow (the `quality` job),
  # and one word should not name two jobs.
  #
  # `$/` is GitHub's self-repository form: the call resolves to this repository
  # at the commit that is running, so it cannot resolve to a stale checkout and
  # it carries no `@ref` to keep current. actionlint's one exception for the
  # form, and why it is github.com-only, live in .github/actionlint.yaml.
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # PyPI only accepts a commit that main already carries. `compare` reports
      # the head relative to main: `identical` is the main tip, `behind` is an
      # older commit main already has (both are on main), while `ahead` is a
      # branch commit main does not have and `diverged` is a rewrite. Tagging a
      # release branch that bumped the version must not publish.
      - name: Tag is reachable from main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)
          echo "main...${GITHUB_SHA}: ${status}"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::Tag commit is not on main (compare status: ${status})."; exit 1 ;;
          esac

      # The gate built these files, and on a tag it also installed and ran them.
      # Building again here would ship a different zip — wheel entries carry
      # timestamps — so the smoke would prove an artifact that never reaches
      # PyPI. Consume the proven one instead (ADR-0006).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The tag names the release; the wheel carries the version that PyPI
      # reserves. Compare the shipped artifact, not the source.
      - name: Built version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          wheel=$(ls dist/*.whl)
          version=$(python3 -c 'import sys; print(sys.argv[1].rsplit("/", 1)[-1].split("-")[1])' "$wheel")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag} wheel=${version}"
          test "${tag}" = "${version}"

  publish:
    needs: build
    # Manual runs stop after the build: they are a rehearsal, not a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/polyx-microplastics
    permissions:
      id-token: write   # Trusted Publishing, plus the Sigstore attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true

  release:
    # Deliberately not `needs: publish` (#203): desktop delivery must not depend
    # on PyPI credentials or availability. The release is still complete — it
    # attaches the wheel and sdist produced by `build` plus the desktop ZIP, so
    # a failed upload cannot publish a release with files missing. A red
    # `publish` job remains visible on the same tag run.
    needs: [desktop, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # create the GitHub release for this tag
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop
          path: dist/desktop

      # The release is the human-readable record of what shipped, with the
      # same files attached: the wheel and sdist for PyPI, and the desktop ZIP
      # with the checksum beside it so a user can detect a damaged download.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*.whl
          dist/*.tar.gz
          dist/desktop/*.zip
          dist/desktop/*.sha256
