# Minimal lint-and-test pipeline: install the exact versions from uv.lock (the
# numpy==1.26.4 pin is fragile: bump numpy or ultralytics and it must be known
# here, not on the studio machine), then run the full pytest suite without
# windows.
#
# This workflow is also the publish gate: `publish.yml` calls it through
# `workflow_call`, so a tag can only reach PyPI after the same suite passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual run to reproduce a failure on any branch
  workflow_call:       # publish.yml gates on this suite

permissions:
  contents: read

# A new push to the same ref cancels the previous run: the old results no
# longer say anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # uv manages the environment from uv.lock. Check the lock before any
      # sync so a stale lock fails loudly instead of being repaired in place.
      - name: Lockfile is current
        run: uv lock --check

      # Headless install path: run before the gui extra is installed, so this
      # step proves the installer tests do not need PySide6.
      - name: Install script smoke checks
        run: |
          bash -n install/*.sh install/*.command
          python -m py_compile install/bootstrap.py install/gpu.py install/update.py install/versions.py
          uv run --locked pytest -q tests/test_install.py

      # requirements.txt is kept as the end-user manifest (SETUP.bat).
      - name: Sync dependencies
        run: uv sync --locked --python 3.11 --extra gui

      # The gate runs the suite, which imports PySide6 even offscreen, so this
      # job needs the same shared libraries as the test job.
      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # The local gate is the one owner of the checks: catalog audit, palette
      # rule, the full suite, ruff and ty. CI runs it rather than copying the
      # commands, so a check added to tools/check.py cannot silently miss CI.
      - name: Run the gate
        run: uv run --locked --extra gui python tools/check.py

      # Type check: the gate blocks on the engine (core + cli); the GUI stays
      # advisory until its dynamic theme/Qt surface is typed. ty is Astral's
      # checker; config lives in [tool.ty] in pyproject.toml.
      - name: Type check (GUI, advisory)
        run: uv run --locked --extra gui ty check src/polyx/gui
        continue-on-error: true

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 3.11 is covered by the gate in the quality job; this job adds 3.12.
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The suite imports PySide6 (theme, report_html) even with QT offscreen:
      # Qt needs these shared libraries even when there is no display.
      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra gui

      # offscreen: the suite opens no windows but PySide6 asks for a platform.
      # MPLCONFIGDIR: matplotlib wants a writable config dir on a fresh runner.
      - name: Run test suite
        run: >-
          QT_QPA_PLATFORM=offscreen
          MPLCONFIGDIR=/tmp/mplconfig
          uv run --locked --extra gui pytest -q

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [quality, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build -o dist

      # Packaging is invisible to the source gate: Hatchling excludes
      # VCS-ignored files, so the compiled catalogs can silently miss the
      # wheel. Load the packaged catalog the way an installed copy does.
      - name: Packaged catalogs load
        run: python tools/check_wheel.py dist/*.whl

      - name: Smoke-test the wheel (headless)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import polyx; print('version:', polyx.__version__)"
          /tmp/smoke/bin/python -c "import polyx.core.paths as p; assert (p.ASSETS_DIR / 'polyx.ico').is_file(), 'asset missing from wheel'"
          /tmp/smoke/bin/polyx-train --help >/dev/null
          /tmp/smoke/bin/polyx-detect --help >/dev/null
          /tmp/smoke/bin/polyx-eval --help >/dev/null
          /tmp/smoke/bin/polyx-report --help >/dev/null
          /tmp/smoke/bin/polyx-download-models --help >/dev/null
          /tmp/smoke/bin/polyx train --help >/dev/null
          /tmp/smoke/bin/polyx detect --help >/dev/null

      - name: Smoke-test the [gui] extra
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/smoke/bin/pip install --quiet "${WHEEL}[gui]"
          /tmp/smoke/bin/python -c "from polyx.gui.qt import qt_available, require_qt; require_qt(); print('qt_available:', qt_available())"
          /tmp/smoke/bin/python -c "import polyx.gui.launcher; print('gui launcher imports OK')"

      # The wheel a PR produced is now downloadable from the run page, so a
      # reviewer can test it without rebuilding. `wheel`, not `dist`: the
      # publish workflow uploads its own `dist` in the same run when it calls
      # this workflow as its gate, and artifact names must not collide.
      - name: Upload the built wheel and sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # --- the pipeline checks itself -------------------------------------------
  #
  # Both jobs below run *beside* the gate, never in front of it: neither needs
  # another job and nothing needs them, so they cannot lengthen the
  # pull-request verdict. They are jobs here rather than workflows of their own
  # because neither asks for a write permission, which is what would justify
  # their own trigger set and their own pinning burden. They also run when
  # publish.yml calls this workflow; the dependency review is skipped there
  # because it needs pull-request context.

  dependency-review:
    # Exact pins stop a dependency from drifting, not from being vulnerable,
    # and the vector that matters is a pull request that adds a package. This
    # diffs the resolved dependency set against the base branch — Python
    # dependency graphs read `uv.lock` since April 2026 — and fails on a newly
    # introduced advisory, so a vulnerable addition is blocked before merge
    # instead of arriving days later in the weekly Dependabot scan.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No checkout: this action diffs the base and head dependency snapshots
      # through the API, so there is no working tree of an untrusted branch to
      # materialize.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Already the upstream default; naming it means a future default
          # change cannot quietly weaken this check.
          fail-on-severity: low
          # The verdict goes to the job log and the run summary. Posting it in
          # the pull request would need `pull-requests: write`, and this
          # workflow adds no write permission.
          comment-summary-in-pr: never

  workflow-lint:
    # An expression typo is otherwise discovered by a run that has already
    # spent runner-minutes downloading torch. actionlint parses the workflow
    # files in about a second and, with shellcheck on PATH, also lints the
    # shell inside every `run:` block. zizmor audits what a linter cannot see:
    # an action ref that lost its SHA, `${{ }}` interpolated straight into a
    # script, a job that asks for more permission than it uses.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # actionlint has no distribution on PyPI maintained by its author (the
      # `actionlint-py` package is a third-party wrapper), so the pinned
      # release artifact is downloaded and checked against the checksum
      # published with that release. shellcheck is pinned the same way and put
      # on PATH because actionlint only lints `run:` scripts when it finds it.
      - name: Install actionlint and shellcheck
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/workflow-lint"
          mkdir -p "${tools}"

          curl -fsSL -o "${tools}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${tools}/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint

          curl -fsSL -o "${tools}/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  ${tools}/shellcheck.tar.xz" \
            | sha256sum --check --strict
          tar -xJf "${tools}/shellcheck.tar.xz" -C "${tools}" --strip-components=1 \
            shellcheck-v0.10.0/shellcheck

          echo "${tools}" >> "${GITHUB_PATH}"

      # Print what actually resolved: a pin that silently moved would make a
      # green job mean something else than it did yesterday.
      - name: Tool versions
        run: |
          actionlint --version
          shellcheck --version | sed -n '2p'
          uvx zizmor==1.32.0 --version

      - name: actionlint (workflow expressions and shell)
        run: actionlint .github/workflows/*.yml

      # zizmor is published on PyPI by its own authors, so uvx runs it the way
      # the project runs its Python tooling: exact version, isolated
      # environment, nothing added to the repository. Any finding at any
      # severity fails the job; the single documented exception lives in
      # .github/zizmor.yml.
      - name: zizmor (workflow security analysis)
        run: uvx zizmor==1.32.0 --format=github .github/workflows/
