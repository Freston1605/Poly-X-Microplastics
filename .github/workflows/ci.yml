# Lint-de-test masa minima: instalar las versiones exactas del proyecto
# (el pin numpy==1.26.4 es fragil: sube numpy o ultralytics y hay que saberlo
# aqui, no en la maquina del estudio), correr el pytest completo sin ventanas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un empujon nuevo a la misma ref cancela la corrida anterior: los
# resultados viejos ya no dicen nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv manages the environment from uv.lock. Check the lock before any
      # sync so a stale lock fails loudly instead of being repaired in place.
      - name: Lockfile is current
        run: uv lock --check

      # Headless install path: run before the gui extra is installed, so this
      # step proves the installer tests do not need PySide6.
      - name: Install script smoke checks
        run: |
          bash -n install/*.sh install/*.command
          python -m py_compile install/bootstrap.py install/gpu.py install/update.py install/versions.py
          uv run --locked pytest -q tests/test_install.py

      # requirements.txt se mantiene como manifiesto de usuario final (SETUP.bat).
      - name: Sync dependencies
        run: uv sync --locked --python 3.11 --extra gui

      # The gate runs the suite, which imports PySide6 even offscreen, so this
      # job needs the same shared libraries as the test job.
      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # The local gate is the one owner of the checks: catalog audit, palette
      # rule, the full suite, ruff and ty. CI runs it rather than copying the
      # commands, so a check added to tools/check.py cannot silently miss CI.
      - name: Run the gate
        run: uv run --locked --extra gui python tools/check.py

      # Type check: the gate blocks on the engine (core + cli); the GUI stays
      # advisory until its dynamic theme/Qt surface is typed. ty is Astral's
      # checker; config lives in [tool.ty] in pyproject.toml.
      - name: Type check (GUI, advisory)
        run: uv run --locked --extra gui ty check src/polyx/gui
        continue-on-error: true

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 3.11 is covered by the gate in the quality job; this job adds 3.12.
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      # La suite importa PySide6 (theme, report_html) hasta con QT
      # offscreen: Qt gui necesita estas librerias compartidas aunque no
      # haya pantalla.
      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra gui

      # offscreen: la suite no abre ventanas pero PySide6 pide una
      # plataforma. MPLCONFIGDIR: matplotlib quiere un config dir
      # escribible en un runner recien creado.
      - name: Run test suite
        run: >-
          QT_QPA_PLATFORM=offscreen
          MPLCONFIGDIR=/tmp/mplconfig
          uv run --locked --extra gui pytest -q

  build:
    runs-on: ubuntu-24.04
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libs (headless CI)
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build -o dist

      # Packaging is invisible to the source gate: Hatchling excludes
      # VCS-ignored files, so the compiled catalogs can silently miss the
      # wheel. Load the packaged catalog the way an installed copy does.
      - name: Packaged catalogs load
        run: python tools/check_wheel.py dist/*.whl

      - name: Smoke-test the wheel (headless)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import polyx; print('version:', polyx.__version__)"
          /tmp/smoke/bin/python -c "import polyx.core.paths as p; assert (p.ASSETS_DIR / 'polyx.ico').is_file(), 'asset missing from wheel'"
          /tmp/smoke/bin/polyx-train --help >/dev/null
          /tmp/smoke/bin/polyx-detect --help >/dev/null
          /tmp/smoke/bin/polyx-eval --help >/dev/null
          /tmp/smoke/bin/polyx-report --help >/dev/null
          /tmp/smoke/bin/polyx-download-models --help >/dev/null
          /tmp/smoke/bin/polyx train --help >/dev/null
          /tmp/smoke/bin/polyx detect --help >/dev/null

      - name: Smoke-test the [gui] extra
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/smoke/bin/pip install --quiet "$WHEEL[gui]"
          /tmp/smoke/bin/python -c "from polyx.gui.qt import qt_available, require_qt; require_qt(); print('qt_available:', qt_available())"
          /tmp/smoke/bin/python -c "import polyx.gui.launcher; print('gui launcher imports OK')"
