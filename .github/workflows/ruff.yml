# Fast lint gate: ruff installs from the version locked in uv.lock and needs
# no project dependencies, so it reports in seconds instead of after a full
# `uv sync`. Scope matches the paths the gate passes to ruff in tools/check.py;
# agent/ and legacy/ are excluded from pre-commit and are not linted here.
name: Ruff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          src: src tests tools install

      - name: ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          src: src tests tools install
          args: "format --check --diff"
