# zizmor's configuration for the workflow-lint job in ci.yml.
#
# The job runs with zizmor's defaults — the "regular" persona and exit codes
# untouched — so every finding at every severity fails the pull request. This
# file exists for one documented exception, not to lower that bar: filtering
# with `--min-severity` would hide future medium findings too.
rules:
  # The security analysis prefers GitHub's `$/...` self-repository syntax for
  # in-repo reusable workflows, added in July 2026. publish.yml still calls
  # ci.yml as `./.github/workflows/ci.yml`; switching it is a one-line edit in
  # that file and belongs to the change that rewrites the publish workflow, so
  # the finding is ignored by file and stays visible as a follow-up instead of
  # blocking every pull request meanwhile.
  self-repository:
    ignore:
      - publish.yml
