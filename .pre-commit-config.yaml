# Pre-commit hooks for Poly-X.
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
exclude: ^agent/|^legacy/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  - repo: local
    hooks:
      - id: no-hardcoded-fallback
        name: No hardcoded fallback colours
        entry: python tools/check_palette_fallbacks.py
        language: python
        pass_filenames: false
        files: \.py$

      - id: english-added-lines
        name: English identifiers, comments and docstrings in added lines
        entry: python tools/check_english_ids.py
        language: python
        pass_filenames: true
        require_serial: true
        files: ^(?:src|tests)/.*\.py$

      - id: i18n-audit
        name: Translation catalogs match the source tree
        entry: python tools/check_i18n.py
        language: python
        pass_filenames: false
        files: ^(?:src/polyx/.*\.py|src/polyx/locales/.*\.(?:po|pot))$
