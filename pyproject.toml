[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polyx-microplastics"
dynamic = ["version"]
description = "Automated detection and classification of Nile Red-stained microplastics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cristofher Ferrada", email = "cristofher.ferrada@pucv.cl" }]
keywords = [
  "microplastics", "YOLO", "object-detection", "Nile Red", "fluorescence",
  "microscopy", "image-analysis", "computer-vision", "particle-size",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Natural Language :: English",
  "Natural Language :: Spanish",
]
dependencies = [
  "ultralytics==8.3.40",
  "opencv-python-headless==4.10.0.84",
  "numpy==1.26.4",
  "Pillow==12.3.0",
  "matplotlib==3.9.2",
  "PyYAML==6.0.2",
  "psutil==6.0.0",
  # Pins are deliberately strict for a reproducible scientific stack:
  # ultralytics 8.3.x requires numpy<2, and each patch wheel is unit-tested
  # in CI. Loosen only with a test run across the matrix.
]

[project.urls]
Homepage = "https://github.com/CrissFerrada/Poly-X-Microplastics"
Repository = "https://github.com/CrissFerrada/Poly-X-Microplastics"
Issues = "https://github.com/CrissFerrada/Poly-X-Microplastics/issues"
Changelog = "https://github.com/CrissFerrada/Poly-X-Microplastics/blob/main/CHANGELOG.md"


[project.optional-dependencies]
gui = ["PySide6==6.7.2"]
dev = ["pytest", "ruff>=0.17"]
sam2 = ["sam2"]
legacy = ["pyqtgraph==0.13.7"]   # only the legacy/ viewers use it

[project.scripts]
polyx = "polyx.gui.__main__:main"
polyx-gui = "polyx.gui.__main__:main"
polyx-download-models = "polyx.cli.download_models:main"
polyx-train = "polyx.cli.train:main"
polyx-eval = "polyx.cli.eval:main"
polyx-detect = "polyx.cli.detect:main"
polyx-report = "polyx.cli.report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polyx"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "CLAUDE.md", "requirements.txt", "LICENSE", "SECURITY.md"]
[tool.hatch.version]
path = "src/polyx/__init__.py"

[tool.uv]
# Keep the dev/CI lock aligned with the tested stack. torch/torchvision are
# not declared as direct dependencies (ultralytics pulls them in and the
# installer picks the CUDA wheel per GPU), but the resolver must not drift
# to a newer, untested torch. The CPU wheels come from the default index;
# GPU dev setups override with the CUDA wheel via SETUP.bat / uv pip.
constraint-dependencies = ["torch==2.7.1", "torchvision==0.22.1"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "S", "SIM", "RUF", "PLW", "PERF", "ISC", "I", "C4", "FURB", "UP"]
ignore = [
    "E501",        # line length — handled by ruff format (phase B)
    "E701", "E702", # multiple statements on one line (legacy style)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (intentional: ×, –, ñ)
    "S101",        # assert is fine in tests and invariants
    "RUF012",      # mutable class defaults (common in dataclasses/config)
    "SIM905",      # """...""".split() -> list (cosmetic, huge diff for no benefit)
]

[tool.ruff.lint.per-file-ignores]
"src/polyx/gui/theme.py" = ["F821"]
"tests/*" = ["S101", "S105", "S106", "S107", "PLR2004", "S603", "S102", "S310", "S110", "S607", "S606", "S112", "S311", "S608"]
"tools/*" = ["S101", "T201", "S603", "S105"]
