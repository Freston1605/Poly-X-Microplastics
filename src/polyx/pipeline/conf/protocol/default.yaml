# Framework-neutral training protocol. Every family adapter consumes these
# values unchanged; the model is the only variable in a benchmark. Defaults
# are the ones agreed in the pipeline specification.

split: val
seed: 42
epochs: 150
batch: 8
image_size: 1280
optimizer: SGD
learning_rate: 0.01
momentum: 0.937
weight_decay: 0.0005
schedule: cosine
warmup_epochs: 5
augmentation_subset:
  - hsv
  - flip_lr
  - mosaic
amp:
  enabled: true
  dtype: fp16
early_stopping:
  monitor: with_class_score
  mode: max
  patience: 30
  min_delta: 0.001
  restore_best: true
